<section class="section prose" id="design-set">
  <div class="section-head">
    <span class="eyebrow">The design set</span>
    <h2>Ten documents behind the build</h2>
  </div>
  <p>Architecture, constraints and acceptance tests live here. The code follows them; when the two disagree, the brief wins until it is revised.</p>
  <div class="doc-list">
    {% for doc in site.data.docs %}
    <div class="doc-row">
      <a class="doc-name mono" href="{{ site.repo_url }}/blob/main/{{ doc.path }}">{{ doc.name }}</a>
      <span class="doc-does">{{ doc.does }}</span>
    </div>
    {% endfor %}
  </div>
</section>
