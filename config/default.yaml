# Comstar Game AI — default configuration (no secrets; see .cursor/secrets/)

ao:
  base_url: "https://10.0.10.16:8765"
  app_id: comstar-game-ai
  mtls_material_dir: ".cursor/secrets/mtls/comstar-game-ai"
  model: phi4:14b  # F6 / §6: Segesta floor; see docs/ada-model.md
  vision_model: "llava:7b"
  # Catalog id on Ada (AO jetson/extra). Do not pack client.detect_* into the
  # default overlay until Ada detection ensure keeps the Reach WS alive.
  detection_agent: "detect_yolox_nano"
  detection_rtw_agent: "client.detect_rtw_campaign"

game:
  window_title_substrings:
    - "Rome"
    - "Total War"
  pinned_version: null
  steam_app_id: 885970
  launch_args:
    - "-windowed"
    - "-enable_logging"
    - "-verbose_script_logging"

display:
  game_monitor_index: 2
  cursor_monitor_index: 1
  launch_on_game_monitor: true

capture:
  ring_buffer_seconds: 5
  target_fps: 30
  # Production: wgc only (Windows Graphics Capture of the game hwnd).
  # mss is constructible from A/B scripts but refused at Process A startup.
  backend: wgc

campaign:
  mode: grand_campaign
  player_faction: julii
  acceptance_turns: 20
  auto_end_turn: true
  # Max poll window for map-clear readiness before End Turn (not a fixed sleep).
  end_turn_ready_timeout_s: 30
  end_turn_delay_s: 0
  # Measured centre of the red horn button; the previous [0.94, 0.97] hit the HUD bar.
  end_turn_click_norm: [0.980, 0.973]
  save_slug: comstar-julii
  save_path: null
  policy:
    allow_moves: true
  # Campaign-map camera for map→window projection. Bindings discovered from
  # descr_shortcuts.txt (moderntw) via scripts/spike_camera_bindings.py — do not
  # hardcode key names in actuators; resolve through these action ids.
  camera:
    keyset: moderntw
    bindings:
      pan_left: a
      pan_right: d
      pan_forward: w
      # Distinct from zoom_out (also often X) — only used when allow_region_pan.
      pan_back: s
      # action -> descr_shortcuts chord (PageUp / Z / X / Q / E)
      point_to_north: pageup
      zoom_in: z
      zoom_out: x
      rot_l: q
      rot_r: e
    # Canonical pose every projection is defined against. See
    # docs/design/map-window-projection.md § Canonical camera pose.
    canonical_pose:
      rotation: north_up
      # No strat tilt binding in descr_shortcuts (tilt is battle-only). Leave out
      # of the pose unless a live AABB aspect measure says otherwise (P3/P5).
      tilt: fixed
      # Z1: saturate zoom_in, then step out this many times.
      # Learned 2026-09-11 1280×720: H_banner=37 (toggle toast); fidelity-first N=14
      # (min(14, H-8)). Do not push toward H — overlay opens further via wheel.
      zoom_steps_from_max_in: 14
    # Hard clamp on zoom_in (~34 presses full range + margin). Verify Z3 still
    # reports 3D map at max-in before trusting this edge.
    zoom_in_saturate_presses: 40
    quiesce:
      stable_frames: 3
      timeout_s: 4.0
      aabb_epsilon_map: 1.5
    verify:
      # Z7 2026-09-11: measured after Flavius order landed at N=14 (1280×720).
      expected_aabb_width_map: 55.6
      aabb_width_tolerance_map: 8.0
      north_up_aspect_min: 0.55  # width/height; tilted foreshortening drops this
    drag_unrotate:
      # Fallback only when point_to_north fails verification. Bounded closed loop.
      max_attempts: 4
      drag_norm_length: 0.12
    # locate_then_reset | reset_then_locate — set after P7 live evidence.
    reset_sequence: locate_then_reset
  directive:
    # Let AO have a say in the turn. Phase 2 with --directives blocks each turn
    # on SyncCampaignDeliberator before orders. Standalone
    # `comstar-agent --deliberate-loop` is the legacy async writer only.
    # With nothing writing directives every turn reads as the neutral "hold".
    # Turn this off to play the hardcoded policy instead.
    enabled: true
    # F7 hold floor when the model holds against a reachable weaker target.
    # §6 decision: reask once with the rejection stated (alias: retask).
    # Allowed: log | upgrade | reask
    hold_floor: reask
    # Defaults to data/runtime/directive.json when null.
    path: null
    # A directive older than this is ignored outright, so one left on disk by an
    # earlier session cannot steer a fresh run.
    max_age_s: 900
  combat:
    # Battle Deployment reads as a plain parchment modal, so the modal handler would
    # happily click a decision button on it. Auto-resolve is the only safe answer
    # until the battle loop exists, and it has to happen first.
    auto_resolve_battles: true
    # Opt-in. The attack step needs the Lists → Military Forces row of the stack to
    # select (normalised, measured per campaign) and map points to try as targets.
    # It refuses unless the HUD shows a full stack and the cursor turns to a sword.
    attack_enabled: false
    # Preferred Military Forces row for mouse marches / attacks. Null = try defaults.
    army_lists_row_norm: [0.30, 0.415]
    attack_targets: []
  march:
    # Primary: radar-frame destination → calibrate pose → project belief map XY
    # to client → right-click. Assumed-centre bearing probes stay behind
    # allow_legacy_geometry (default off).
    use_map_projection: true
    allow_legacy_geometry: false
    # Z9: off until map_target_vision returns reliable structured output.
    # Projection + glyph gate own settlement/open-field clicks until then.
    use_map_vision: false
    map_vision_timeout_s: 600
    map_vision_min_confidence: 0.55
    # Part B: oval vision → sword → right-click → war Yes (needs use_map_vision).
    use_vision_besiege: false
    # Keyboard A/D/W/S pan while army selected; watch minimap, never click it.
    allow_region_pan: false
  modal:
    min_confidence: 0.72
    min_margin: 0.10
    # "Is a panel covering the map, and where is its decline button" — seconds of
    # work, not minutes. It was 180, which is longer than a turn should take: one
    # slow classification then cost more than the twenty turns around it, and the
    # local heuristics that run when vision gives up are good enough at this.
    model_timeout_s: 25
    save_unresolved_frames: true
    diplomacy_action: reject
    allow_visual_button_fallback: true
    allow_coordinate_fallback: false
    # Off by default. Pixel localizers handle report ticks, floating-notice close X,
    # diplomacy accept/reject, and battle deployment without touching Ada.
    #
    # When on, Ada runs only after pixels miss, and only while ada_yield.lock is
    # held so the campaign director waits for release rather than sharing Ada's
    # one GPU slot with llava. Safe to flip on for hard panels after
    # that pipeline is in place; leave false until a live run looks healthy.
    #
    # Future (separate plan): OCR / template matching as a cheaper first pass
    # before Ada — not mixed into this modal channel.
    use_ada_vision: false
    # Pixel UI sync for ensure_campaign_map. Independent of use_ada_vision.
    # Omit or true = clear panels with pixels; false = skip UI sync entirely.
    # use_ui_sync: true
    decline_click_norms:
      - [0.38, 0.74]
      - [0.42, 0.78]
      - [0.36, 0.80]
    close_click_norms:
      - [0.66, 0.24]
      - [0.70, 0.22]
    continue_click_norms:
      - [0.50, 0.78]

safety:
  # Must exceed the slowest thing the loop legitimately does between pets, or it
  # stops being a safety net and becomes the thing that ends runs. It was 10,
  # which is less than one modal classification on a shared GPU: the watchdog
  # fired mid-turn, released input, and left the loop clicking at a game it no
  # longer controlled. The slow paths pet it now; this is the margin for the ones
  # nobody has thought about yet. The kill hotkey remains the immediate stop.
  deadman_seconds: 30
  kill_hotkey: "ctrl+shift+end"
  takeover_hotkey: "ctrl+shift+home"
  handback_hotkey: "ctrl+shift+pause"
  # Human-override triggers, off until validated on a live campaign. A false
  # positive here aborts a run in progress, so they are armed deliberately.
  # Foreground loss is the safer one and the one to try first. Mouse motion needs
  # every synthetic move declared to the watchdog first, otherwise the agent's own
  # clicks read as a human grabbing the mouse.
  human_override_on_foreground_loss: false
  human_override_on_mouse: false
  human_override_tolerance_px: 6

paths:
  rome_logs: "%USERPROFILE%/AppData/Local/Feral Interactive/Rome/logs"
  rome_data: null  # discovered at runtime
  # The game's shipped string tables, which name and explain the UI. Left null so
  # the usual Steam library locations are searched; set it when the install is
  # somewhere unusual. Override for one run with COMSTAR_ROME_TEXT.
  rome_text: null

ipc:
  event_socket_host: "127.0.0.1"
  event_socket_port: 9876

overlay:
  # Opt-in SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE). Off by default so
  # OBS can show the overlay; WGC window capture of the game is primary for
  # frame hygiene. The capture-exclusion self-test must still pass with this false.
  exclude_from_capture: false
