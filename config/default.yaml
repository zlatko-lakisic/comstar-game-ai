# Comstar Game AI — default configuration (no secrets; see .cursor/secrets/)

ao:
  base_url: "https://10.0.10.16:8765"
  app_id: comstar-game-ai
  mtls_material_dir: ".cursor/secrets/mtls/comstar-game-ai"
  model: null  # pinned after ada survey in docs/ada-model.md
  vision_model: "llava:7b"

game:
  window_title_substrings:
    - "Rome"
    - "Total War"
  pinned_version: null
  steam_app_id: 885970
  launch_args:
    - "-windowed"
    - "-enable_logging"
    - "-verbose_script_logging"

display:
  game_monitor_index: 2
  cursor_monitor_index: 1
  launch_on_game_monitor: true

capture:
  ring_buffer_seconds: 5
  target_fps: 30
  backend: wgc  # wgc | printwindow

campaign:
  mode: grand_campaign
  player_faction: julii
  acceptance_turns: 20
  auto_end_turn: true
  # Max poll window for map-clear readiness before End Turn (not a fixed sleep).
  end_turn_ready_timeout_s: 30
  end_turn_delay_s: 0
  # Measured centre of the red horn button; the previous [0.94, 0.97] hit the HUD bar.
  end_turn_click_norm: [0.980, 0.973]
  save_slug: comstar-julii
  save_path: null
  policy:
    allow_moves: true
  modal:
    min_confidence: 0.72
    min_margin: 0.10
    model_timeout_s: 180
    save_unresolved_frames: true
    diplomacy_action: reject
    allow_visual_button_fallback: true
    allow_coordinate_fallback: false
    # Ada/LLaVA recognizes the panel and its buttons; pixel localization only backs it up.
    use_ada_vision: true
    decline_click_norms:
      - [0.38, 0.74]
      - [0.42, 0.78]
      - [0.36, 0.80]
    close_click_norms:
      - [0.66, 0.24]
      - [0.70, 0.22]
    continue_click_norms:
      - [0.50, 0.78]

safety:
  deadman_seconds: 10
  kill_hotkey: "ctrl+shift+end"
  takeover_hotkey: "ctrl+shift+home"
  handback_hotkey: "ctrl+shift+pause"
  # Human-override triggers, off until validated on a live campaign. A false
  # positive here aborts a run in progress, so they are armed deliberately.
  # Foreground loss is the safer one and the one to try first. Mouse motion needs
  # every synthetic move declared to the watchdog first, otherwise the agent's own
  # clicks read as a human grabbing the mouse.
  human_override_on_foreground_loss: false
  human_override_on_mouse: false
  human_override_tolerance_px: 6

paths:
  rome_logs: "%USERPROFILE%/AppData/Local/Feral Interactive/Rome/logs"
  rome_data: null  # discovered at runtime

ipc:
  event_socket_host: "127.0.0.1"
  event_socket_port: 9876
