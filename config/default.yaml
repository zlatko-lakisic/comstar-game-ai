# Comstar Game AI — default configuration (no secrets; see .cursor/secrets/)

ao:
  base_url: "https://10.0.10.16:8765"
  app_id: comstar-game-ai
  mtls_material_dir: ".cursor/secrets/mtls/comstar-game-ai"
  model: phi4:14b  # F6 / §6: Segesta floor; see docs/ada-model.md
  vision_model: "llava:7b"

game:
  window_title_substrings:
    - "Rome"
    - "Total War"
  pinned_version: null
  steam_app_id: 885970
  launch_args:
    - "-windowed"
    - "-enable_logging"
    - "-verbose_script_logging"

display:
  game_monitor_index: 2
  cursor_monitor_index: 1
  launch_on_game_monitor: true

capture:
  ring_buffer_seconds: 5
  target_fps: 30
  backend: wgc  # wgc | printwindow

campaign:
  mode: grand_campaign
  player_faction: julii
  acceptance_turns: 20
  auto_end_turn: true
  # Max poll window for map-clear readiness before End Turn (not a fixed sleep).
  end_turn_ready_timeout_s: 30
  end_turn_delay_s: 0
  # Measured centre of the red horn button; the previous [0.94, 0.97] hit the HUD bar.
  end_turn_click_norm: [0.980, 0.973]
  save_slug: comstar-julii
  save_path: null
  policy:
    allow_moves: true
  directive:
    # Let AO have a say in the turn. Needs Process B running
    # (`comstar-agent --deliberate-loop`) to write them: with nothing writing
    # directives every turn reads as the neutral "hold" and the loop stops
    # advancing characters. Turn this off to play the hardcoded policy instead.
    enabled: true
    # F7 hold floor when the model holds against a reachable weaker target.
    # §6 decision: reask once with the rejection stated (alias: retask).
    # Allowed: log | upgrade | reask
    hold_floor: reask
    # Defaults to data/runtime/directive.json when null.
    path: null
    # A directive older than this is ignored outright, so one left on disk by an
    # earlier session cannot steer a fresh run.
    max_age_s: 900
  combat:
    # Battle Deployment reads as a plain parchment modal, so the modal handler would
    # happily click a decision button on it. Auto-resolve is the only safe answer
    # until the battle loop exists, and it has to happen first.
    auto_resolve_battles: true
    # Opt-in. The attack step needs the Lists → Military Forces row of the stack to
    # select (normalised, measured per campaign) and map points to try as targets.
    # It refuses unless the HUD shows a full stack and the cursor turns to a sword.
    attack_enabled: false
    army_lists_row_norm: null
    attack_targets: []
  modal:
    min_confidence: 0.72
    min_margin: 0.10
    # "Is a panel covering the map, and where is its decline button" — seconds of
    # work, not minutes. It was 180, which is longer than a turn should take: one
    # slow classification then cost more than the twenty turns around it, and the
    # local heuristics that run when vision gives up are good enough at this.
    model_timeout_s: 25
    save_unresolved_frames: true
    diplomacy_action: reject
    allow_visual_button_fallback: true
    allow_coordinate_fallback: false
    # Off, on the evidence of a full 20-turn run: twelve vision calls, zero usable
    # results, 25 seconds each. The pixel localizers meanwhile handled every panel
    # the run met — report tick, floating-notice close X, diplomacy accept/reject,
    # battle deployment.
    #
    # Worse than useless, though. A llava:7b run hung and held the resource
    # broker's only execution slot for nine minutes, and three requests starved
    # behind it — including the llama3.1:8b the campaign director needs. So a modal
    # frame sent to Ada can silently stop the director from thinking at all. Not a
    # trade worth making for a job the pixels already do.
    #
    # The channel itself is correct and tested (see modal_vision_schema and its
    # JSON mode); turn this back on with a vision model that can answer under a
    # grammar without wedging.
    use_ada_vision: false
    decline_click_norms:
      - [0.38, 0.74]
      - [0.42, 0.78]
      - [0.36, 0.80]
    close_click_norms:
      - [0.66, 0.24]
      - [0.70, 0.22]
    continue_click_norms:
      - [0.50, 0.78]

safety:
  # Must exceed the slowest thing the loop legitimately does between pets, or it
  # stops being a safety net and becomes the thing that ends runs. It was 10,
  # which is less than one modal classification on a shared GPU: the watchdog
  # fired mid-turn, released input, and left the loop clicking at a game it no
  # longer controlled. The slow paths pet it now; this is the margin for the ones
  # nobody has thought about yet. The kill hotkey remains the immediate stop.
  deadman_seconds: 30
  kill_hotkey: "ctrl+shift+end"
  takeover_hotkey: "ctrl+shift+home"
  handback_hotkey: "ctrl+shift+pause"
  # Human-override triggers, off until validated on a live campaign. A false
  # positive here aborts a run in progress, so they are armed deliberately.
  # Foreground loss is the safer one and the one to try first. Mouse motion needs
  # every synthetic move declared to the watchdog first, otherwise the agent's own
  # clicks read as a human grabbing the mouse.
  human_override_on_foreground_loss: false
  human_override_on_mouse: false
  human_override_tolerance_px: 6

paths:
  rome_logs: "%USERPROFILE%/AppData/Local/Feral Interactive/Rome/logs"
  rome_data: null  # discovered at runtime
  # The game's shipped string tables, which name and explain the UI. Left null so
  # the usual Steam library locations are searched; set it when the install is
  # somewhere unusual. Override for one run with COMSTAR_ROME_TEXT.
  rome_text: null

ipc:
  event_socket_host: "127.0.0.1"
  event_socket_port: 9876
