id: campaign_ui_atlas
description: Where each part of the Rome Remastered campaign screen is, what every panel is for, and the
  game's own key bindings for traversal and panels.
game: 'Total War: ROME REMASTERED'
schema_version: 1
generated_by: scripts/build_campaign_atlas_overlay.py
verified: '2026-09-05'
frame:
  coordinate_space: client_rect_normalised
  measured_client_size:
  - 1920
  - 1080
  aspect: '16:9'
  warning: Capture the client rect, not the window rect. On the reference machine the window is 1936x1119
    and the client 1920x1080; measuring against the window offsets every derived click.
inject:
  heading: '## Campaign screen atlas'
  max_chars: 6000
how_to_use:
- Treat every coordinate as somewhere to look, not somewhere to click blindly. end_turn_button, map_overlay_button
  and faction_standard_button have been confirmed by an actuation.
- 'Prefer a key binding over a click when both exist: the bindings come from the game''s own database
  and need no localisation.'
- Prefer a radar click over held panning to cross distance.
- A blocking panel with no close X is a decision panel — read its footer instead of hunting for a dismiss
  button.
- 'Overview dialogs (Faction Summary and its six sibling tabs) close with the red X at the dialog''s top-right,
  or Escape. The map overlay is not a dialog: Escape or a second click on the eye-and-scroll disc leaves
  it.'
- If the camera is lost, press Home. It frames the capital from anywhere and is the reason any other camera
  move is safe to attempt.
- The Event Log dock (Alerts / News / Reports / Missions) closes with its gold X, or by clicking the already-selected
  tab. Do not press Escape to find out if it is open — Escape on a closed dock is the pause menu.
- Never infer a settlement's owner from colour alone. Colour picks what to hover; the tooltip decides.
- For what to *read* from each panel, use the information catalog — one authoritative surface per question.
  For what happened last time we tried something, use the learnings list (action, measured outcome, valence).
- 'A selected spy or diplomat paints a green movement range. Drag-hold previews the path; release on the
  character to cancel. Sending from the HUD is three clicks: a SEND row stages the path, send-panel Confirm
  opens the briefing, Assign commits. The corner hourglass is End Turn. The boot Disbands.'
information:
- id: settlement_owner
  question: Who owns this settlement, and how do we stand with them?
  surface: settlement_hover
  how: Hover the settlement on the 3D map until the tooltip fires. Do not click.
  reads: 'Name, owning faction, tier, and a standing suffix: (At war), (Neutral), (Ally). No suffix means
    it is ours. Owned towns also offer ''x2 to get further information''.'
  trap: Pills are a prefilter, not a verdict. Never infer owner from colour alone.
- id: settlement_activity
  question: Which of our towns still need orders?
  surface: map_overlay.settlements
  how: Open Map Overlay (eye, or Tab). Settlements is a checkbox — leave it ticked.
  reads: 'Activity states the hover cannot give: recruiting or constructing, upgrade possible, settlement
    idle. Idle is the cheapest ''needs orders'' read.'
  trap: The overlay replaces the 3D map. A click inside the view does not move the camera.
- id: settlement_economy
  question: What is this owned settlement's population and income?
  surface: lists_scroll
  how: Ctrl+5, Settlements row. Read the detail pane. Close with the dialog X or Escape.
  reads: Authoritative population and income for towns we own.
  trap: Hover figures are not population or income. Coin 184 sat next to Lists 3500 / 1710.
- id: treasury
  question: How much money do we have this turn?
  surface: treasury_readout
  how: Read the top-right HUD. No panel.
  reads: Current treasury and the signed per-turn change, e.g. 5000 (+442).
  trap: Finance's 'Boundless' is a band, not a number.
- id: finance_breakdown
  question: Where is the money coming from and going?
  surface: finance_window
  how: Ctrl+4, Financial Overview. Expand a row's chevron. Do not touch Automanage.
  reads: Labelled income and expenditure lines.
  trap: Automanage radios change how the faction is run.
- id: allies_and_enemies
  question: Who are we allied with, and who are we at war with?
  surface: diplomacy_window
  how: Ctrl+3, Diplomatic Standing, select our crest.
  reads: Reputation, treasury band, rows for Allies / Enemies / Trade Partners / Trade Embargo / Protectorates,
    plus a territory minimap.
  trap: This tab reports standing; it does not negotiate. Talks are `diplomatic_negotiations`, a decision
    panel with no close X.
- id: diplomacy_on_the_map
  question: How does a foreign settlement stand relative to us, including indirect ties?
  surface: map_overlay.diplomacy
  how: Open Map Overlay. Diplomacy is a radio — it replaces Factions, it does not add a layer.
  reads: 'Six standings the hover never says: Player, Ally, Ally of Ally, Neutral, Enemy, Ally of Enemy.'
  trap: A hover says Ally / At war / Neutral only. SMT_ALLIES reads 'Allies' (legend), not 'Ally'.
- id: senate_mission
  question: What has the Senate asked us to do, and how long is left?
  surface: event_log.missions
  how: Left-edge eagle disc, or Faction Summary (Ctrl+1). Same card both places this turn. Close the dock
    with its X, not Escape.
  reads: Objective, target, turns remaining, reward line. Locate magnifier frames the target.
  trap: This is not the Senate overview (Ctrl+2). The 9+ badge may outnumber the visible cards.
- id: faction_summary
  question: Who leads us, what are we trying to win, and what is the headline state?
  surface: faction_summary
  how: Bottom-left standard, or Ctrl+1. Close with the red X or Escape.
  reads: Leader and three attribute rows, victory conditions, current Senate mission with locate, faction
    stats, ranking rows, diplomacy crests.
  trap: The seven top crests are other tabs.
- id: senate_offices
  question: How popular are we with the Senate and the People, and which offices are open?
  surface: senate_window
  how: Second crest on the overview strip, or Ctrl+2. Policy / Current Standing.
  reads: Senate & People popularity and the offices list.
  trap: The Policy grid is a selector.
- id: region_owner_without_moving
  question: Who owns a province we are not looking at?
  surface: radar
  how: Hover the radar. Do not click unless the camera should jump.
  reads: Tooltip names the region and its owning faction. Camera stays put.
  trap: A radar click is coarse.
- id: find_capital
  question: Where is our capital, and how do we recover a lost camera?
  surface: capital_zoom
  how: Press Home. One press from anywhere.
  reads: Frames the capital. Also selects it, so the HUD switches to that governor.
  trap: Home is recovery, not a free look. It changes selection.
- id: find_owned_settlement
  question: How do we frame a town we own that is not the capital?
  surface: lists_scroll
  how: Ctrl+5, Settlements, first footer. Close the dialog after.
  reads: Camera jumps to that settlement.
  trap: The third footer button sets the faction capital permanently. Do not click it.
- id: pending_alerts
  question: What urgent empire problems is the game flagging?
  surface: event_log.alerts
  how: 'Left-edge horn disc. Tooltip: ''Highlights the most important information about running your empire''.'
  reads: Alert cards, or 'NO ALERTS' when the list is empty.
  trap: Clicking the already-selected tab collapses the dock. Do not click Filters.
- id: pending_news
  question: What happened to us and to other factions?
  surface: event_log.news
  how: 'Left-edge sealed-scrolls disc. Tooltip: ''Brings information about all factions, including yours''.'
  reads: News cards, or 'NO NEWS'.
  trap: Same dismiss rules as Alerts. Empty on Julii turn 1.
- id: pending_reports
  question: What built, recruited, or arrived in the end-of-turn report?
  surface: event_log.reports
  how: 'Left-edge coins disc. Tooltip: ''On recruitment and construction, as well as the End Of Turn Report''.'
  reads: Construction, recruitment, and end-of-turn report cards, or 'NO REPORTS'.
  trap: Same dismiss rules as Alerts. Empty on Julii turn 1 before anything has built.
- id: build_options
  question: What can this settlement build, and what does a building do?
  surface: construction_window
  how: Select the town, press 6. Hover an icon.
  reads: Name, cost, build time, and the effect list from the hover.
  trap: A left-click queues the spend. Right-click opens details.
- id: recruit_options
  question: What can this settlement recruit?
  surface: training_window
  how: Select the town, press 5. Hover a card.
  reads: Name, size, produce cost, down-arrow upkeep, time, and the recruit/retrain grids.
  trap: A left-click queues the unit and spends money.
- id: building_unlock_line
  question: What unlocks a building, unit, or agent in this town?
  surface: building_browser
  how: Tree disc (0.934, 0.968) or right-click Construction.
  reads: Tier columns with population thresholds, colour vs grey, and who each building trains. Diplomat
    is the Villa; Spy is the Market; Assassin is the Forum.
  trap: Green and red tree lines are not accept/reject.
- id: agent_identity
  question: Who is this spy or diplomat, and what can they do this turn?
  surface: agent_selection_hud
  how: Click the character on the map, or Lists → Agents → locate. Do not click Disband.
  reads: 'Left card: name, type, location, age, Influence or Subterfuge. Green range on the map. Right
    list titles SEND EMISSARY or SEND SPY with success % and turns-to-arrive.'
  trap: The centre strip is agents at this place, not this character's followers. Followers are on the
    character scroll. The corner hourglass is End Turn, not Confirm.
- id: agent_traits
  question: What traits and followers does this character have?
  surface: character_scroll
  how: Click the traits HUD button. Close with that parchment's X at (0.740, 0.275).
  reads: Type title, STATS / TRAITS & FOLLOWERS tabs, trait text and follower slots.
  trap: Alt+click opens the Steam wiki.
- id: agent_roster
  question: Which agents do we have, and where are they?
  surface: lists_scroll
  how: Ctrl+5, Agents sub-tab. Locate closes Lists and selects the agent. Or Ctrl+7.
  reads: Type, name, location, skill. Agent Hub repeats the roster next to Send Agent to.
  trap: A SEND-list row only stages the path. Assign commits. After that, Lists shows Cancel Mission —
    that undoes the send. Do not click it while reading.
- id: agent_target_distance
  question: How far is a send target, and which one is nearest?
  surface: agent_selection_hud
  how: Select the agent. Read the turn glyph on each SEND EMISSARY / SEND SPY row. Do not click Assign
    unless the send is intended.
  reads: 'Turns-to-arrive: `[1]`, `[2]`, … . The smaller glyph is nearer. Among characters, the first
    character row with the smallest glyph is the closest person.'
  trap: A model standing next to the spy on the 3D map is not the distance read. Eyeballing picked Eporedorix;
    Senaculus of Sabis was the first character row and the shorter glyph. Closest is a fact, not a policy.
- id: army_roster
  question: Which armies and fleets do we have?
  surface: lists_scroll
  how: Ctrl+5, Military Forces. Hover a row for upkeep. Locate or double-click to frame.
  reads: Name, unit count, command/management/influence, stack upkeep on hover.
  trap: The Settlements footer 3 sets the capital. Use Military Forces locate.
- id: map_order
  question: How do we send an army or agent to a map target?
  surface: map_viewport
  how: Select the character, hover until the cursor glyph changes, then left-click.
  reads: Sword cursor is an army attack. Town attack is a siege; a field army is Battle Deployment.
  trap: 2004 cursor strings say Right click. A nameplate click before the sword selects the town. Do not
    click a Gallic stack.
learnings:
- id: escape_on_clear_map_pauses
  action: Press Escape on a campaign map with no parchment open
  outcome: Pause menu and Help Sheet opened. First item is Return to Game.
  valence: bad
  lesson: Do not use Escape to find out whether a panel is open. Prefer that panel's close X. If the pause
    menu is up, click Return to Game — do not click Exit.
  evidence: data/runtime/sweep/dock_clear.png after Escape on a clear map
  durable: true
- id: selected_event_log_tab_toggles_shut
  action: Click the already-selected Event Log tab
  outcome: The dock collapsed. Later clicks at the open-tab x landed on the map.
  valence: mixed
  lesson: Clicking the selected tab is a valid close, alongside the gold X. Do not click Alerts again
    to 'make sure' it is open.
  evidence: 'dock_walk: dock_tab_open_1.png measured panel=None after that click'
  durable: true
- id: event_log_hover_or_click_opens
  action: Hover or click a collapsed left-edge Event Log disc
  outcome: Parchment slid out to the right; the four discs rode to its right edge.
  valence: good
  lesson: The discs are the opener. toggle_news_panel is unbound in moderntw.
  evidence: dock_switch_opened.png; hover on the horn also opened it
  durable: true
- id: event_log_close_x_works
  action: Click the gold X at (0.160, 0.077) on the open Event Log
  outcome: Dock collapsed. Mode stayed campaign_map.
  valence: good
  lesson: Prefer this X over Escape. Same corner as the old senate_mission_card.
  evidence: dock_switch_after_close_x.png
  durable: true
- id: home_recovers_the_camera
  action: Press Home from an arbitrary camera
  outcome: Capital framed in one press. The capital was also selected.
  valence: good
  lesson: Home is the recovery primitive. It also changes selection.
  evidence: navigation sweep; capital_zoom bound to Home in both keysets
  durable: true
- id: settlement_tooltip_is_authoritative
  action: Hover Segesta, Patavium, and Rome
  outcome: Tooltips said (At war) / (Neutral) / (Ally).
  valence: good
  lesson: Colour picks what to hover; the tooltip decides owner and standing.
  evidence: settlements.py cross-check on Julii turn 1
  durable: true
- id: tooltip_figures_are_not_economy
  action: Read the three unlabelled figures on a settlement hover
  outcome: Coin 184 next to Lists population 3500 / income 1710 for the same town.
  valence: bad
  lesson: Population and income come from Lists, not from the hover figures.
  evidence: guided settlement identification, Julii turn 1
  durable: true
- id: label_pill_rgb_is_not_the_legend
  action: Match a map label-pill colour to the overlay standing legend
  outcome: The RGBs disagree. A colour match would mis-tag standing.
  valence: bad
  lesson: Pills are a prefilter. Overlay legend and tooltip are the keys.
  evidence: settlements.LABEL_PILL_COLOURS vs overlay legend samples
  durable: true
- id: overlay_is_not_a_clickable_map
  action: Click inside the Map Overlay view, hoping to jump the camera
  outcome: Camera did not move.
  valence: mixed
  lesson: The overlay is a legend, not a navigator. Use Home, Lists locate, or the radar.
  evidence: map overlay guided sweep
  durable: true
- id: alt_click_overlay_opens_wiki
  action: Alt+click an overlay layer button
  outcome: Steam wiki overlay opened — same hazard as F1.
  valence: bad
  lesson: Never Alt+click a layer. Hold-Alt-to-expand-tooltip is a different control.
  evidence: map_overlay.py note; F1 help_window is EXTERNAL for the same reason
  durable: true
- id: guessed_hud_clicks_open_the_browser
  action: Click unverified positions near End Turn
  outcome: Five guessed candidates missed; one opened the building browser and wedged the run.
  valence: bad
  lesson: Locate a control before clicking it. Never sweep candidate coordinates.
  evidence: never_blind_click_the_hud in campaign_ui_facts.yaml
  durable: true
- id: lists_third_footer_sets_capital
  action: Click the third footer button on the Lists settlement pane
  outcome: Would permanently change the faction capital.
  valence: bad
  lesson: First footer locates. Second explores the battle map. Third sets capital. Use the first.
  evidence: hover_lists_btn1..3.png; lists_scroll note
  durable: true
- id: family_tree_can_set_the_heir
  action: Click in the Family Tree sub-tab of Finance & Family
  outcome: The tab's own tooltip offers setting the faction heir — a succession change.
  valence: bad
  lesson: Read the tree. Do not click a character to 'inspect' them there.
  evidence: Finance & Family hover; SMT family-tree tooltip
  durable: true
- id: event_log_filters_change_incoming_mail
  action: Click the Filters funnel on the Event Log
  outcome: 'Not clicked. Tooltip: ''Select which type of messages you receive.'''
  valence: bad
  lesson: The funnel is a setting, not a view. Do not click it while reading.
  evidence: dock_chrome2_filter.png
  durable: true
- id: senate_mission_agrees_across_surfaces
  action: Read the mission on Faction Summary and again on Event Log → Missions
  outcome: Both showed Take Settlement Segesta, 10 turns, richly rewarded.
  valence: good
  lesson: Either surface is enough. The Event Log card is the same notice, not a second mission.
  evidence: fs_tab_1 / dock_switch_4.png, Julii turn 1
  durable: true
- id: agent_drag_previews_path
  action: Hold left mouse on a diplomat, drag toward a road, then release back on him
  outcome: A green path appeared while held. On release he was still idle at Arretium.
  valence: good
  lesson: Drag-hold is the preview. Release on the character to cancel. A click on a destination is an
    order — do not click the map just to look.
  evidence: agent_path_preview.png / agent_path_released.png
  durable: true
- id: traits_button_opens_character_scroll
  action: Click the enabled left-HUD button on Sextus Antio
  outcome: 'Character scroll titled DIPLOMAT opened (panel top 0.261). Traits & Followers showed Diplomatic
    +3 and Followers: None.'
  valence: good
  lesson: That button is the extra-info pane. Close with its own X, not the overview-tab X.
  evidence: agent_left_info.png; close at (0.740, 0.275)
  durable: true
- id: agent_hub_confirm_dispatches
  action: Open Agent Hub (Ctrl+7) with a Send Agent row highlighted
  outcome: Gold Confirm sat on the briefing. Not clicked. The first row was Negotiate with Tarentum, 3
    turns.
  valence: bad
  lesson: Confirm sends the agent. Close with the overview X. The map SEND list is a second dispatcher.
  evidence: agent_hub_ctrl7.png
  durable: true
- id: disband_boot_is_live
  action: Inspect the selected-agent HUD boot without clicking it
  outcome: Boot sits on the centre strip. Delete is bound to the same action.
  valence: bad
  lesson: The boot disbands the character. Do not click it or press Delete.
  evidence: agent_located_0.png / agent_located_1.png
  durable: true
- id: send_list_is_three_clicks
  action: Click Spy on Patavium, then Confirm, then Assign
  outcome: 'Row drew a green/red path to Patavium. Confirm opened ''Send Agent to: Patavium'' with Cancel
    Mission. Assign committed: Lists shows Target: Patavium and Cancel Mission; location flipped from
    Ariminum to Patavium. The same three clicks sent Sextus Antio to negotiate with Patavium.'
  valence: good
  lesson: Row stages, Confirm opens the briefing, Assign commits. The corner hourglass is End Turn — Confirm
    sits left of it at about (0.90, 0.93).
  evidence: spy_send_patavium.png / spy_assigned_patavium.png / crop_agent_lists_detail_0.png
  durable: true
- id: spy_on_nearest_gallic_character
  action: Pick the Gallic model standing on the road next to the spy and send to Eporedorix
  outcome: Mission assigned to Eporedorix. Senaculus of Sabis was the first character row on SEND SPY
    and carried the shorter turn glyph.
  valence: bad
  lesson: Do not infer distance from who looks nearest on the 3D map. Read the SEND-list turn glyph. Closest
    is a read; it is not automatically the right target.
  evidence: spy_located_now.png SEND list vs spy_on_gallic.png map hover
  durable: true
- id: send_list_turn_glyph_is_distance
  action: Compare SEND SPY character rows after the spy reached Patavium
  outcome: Senaculus of Sabis sat above Eporedorix and showed the smaller turn count. The path line on
    the map did not decide who was nearer.
  valence: good
  lesson: Distance is the `[n]` glyph on the send row. Compare glyphs within characters or within settlements,
    not across types.
  evidence: spy_located_now.png SEND SPY list; Senaculus first character row
  durable: true
- id: building_browser_tree_disc_opens
  action: Click the tree disc at (0.934, 0.968) with Arretium selected
  outcome: Building Browser opened. Escape does not close it.
  valence: good
  lesson: That disc is the opener. Close with the parchment X.
  evidence: town_browser.png panel=(492, 1427, 223); tt_f934.png
  durable: true
- id: map_order_waits_for_the_cursor_glyph
  action: Left-click Segesta's nameplate with Flavius selected
  outcome: Selected Enemy SEGESTA Village.
  valence: mixed
  lesson: Wait for the sword cursor.
  evidence: 'army_sword_on_segesta.png / army_attack_segesta2.png; operator: left-click after glyph'
  durable: true
- id: field_construction_opens_from_the_town_disc
  action: Click Construction <6> with Flavius in the field
  outcome: Watchtower and fort cards opened.
  valence: good
  lesson: A card click spends.
  evidence: army_construct_click.png / crop_field_con_zoom.png
  durable: true
regions:
- id: map_viewport
  kind: viewport
  bounds:
  - 0.0
  - 0.055
  - 1.0
  - 0.94
  centre:
  - 0.5
  - 0.4975
  purpose: The campaign world. Select a character, then left-click a target once the cursor glyph changes
    (sword for an army attack).
  precision: measured
  note: 'This is the base layer, not an exclusive area: the radar and other HUD furniture are drawn on
    top of it and swallow clicks that land on them. Resolve a point with region_at rather than testing
    this rectangle, which answers ''is the map under here'', not ''will a click reach the map''. A click
    meant for the HUD that does reach the map mutates game state instead of doing nothing.'
- id: radar
  kind: button
  bounds:
  - 0.879
  - 0.055
  - 0.998
  - 0.185
  centre:
  - 0.9385
  - 0.12
  purpose: Strategic minimap of the whole world. Clicking a point jumps the camera there, which is the
    cheap way to traverse the map.
  precision: measured
  note: 'A red trapezoid drawn on it is the live camera frustum, so the radar reports where the camera
    is looking as well as accepting where to go. Panning with WASD covers a fraction of this per press;
    a radar click crosses the map in one action. Toggle with toggle_radar; toggle_hires_radar gives a
    fullscreen version. It also carries the faction-coloured ownership of everything explored, in the
    same palette the overlay legend states, so our own territory can be found on it without opening anything
    — and hovering it returns a tooltip naming the region and its owning faction, which makes it a zero-risk
    survey instrument as well as a control. Read positions off it by sampling, not by eye: it is about
    228 px wide for the whole Mediterranean, so an eyeballed click can miss a province by a long march.'
