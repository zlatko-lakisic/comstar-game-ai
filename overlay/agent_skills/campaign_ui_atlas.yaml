navigation:
  recovery: Home (capital_zoom) frames the faction capital in one press from anywhere, with no calibration.
    Because it always works, any other camera move is safe to try — this is the undo.
  strategies:
  - id: capital_zoom
    accuracy: exact
    requires: nothing — works from a bare campaign map at any camera position
    how: tap Home (action capital_zoom, bound in the strat section of both keysets)
    note: The primitive to build on. Also selects the capital, so the bottom HUD bar switches to its governor
      — convenient, but it means the camera move is not side-effect free with respect to selection.
  - id: locate_via_lists
    accuracy: exact
    requires: Ctrl+5 (Lists), Settlements sub-tab, a row selected
    how: open Lists, click the settlement's row, then the magnifier in the footer, which the game names
      'Locate position of settlement'
    note: 'The general form of capital_zoom: reaches any settlement we own, not just the capital. Closes
      the Lists panel on use, so it costs no separate dismissal. Its two neighbouring footer buttons are
      not harmless — the third sets the faction capital permanently — so click the magnifier by position,
      carefully.'
  - id: radar_click
    accuracy: coarse
    requires: the radar, which is always present unless toggled off with Ctrl+M
    how: click a point on the radar to centre the camera on the matching map point
    note: 'Coarse for a structural reason, not a fixable one: the radar is about 228 px wide for the whole
      Mediterranean, so one radar pixel is a long march, and a province centroid is not a settlement.
      Good for ''get me to that region'', then hand off to zoom and a look. Pair with zoom_out first so
      the landing frame covers enough ground to contain something.'
  - id: arrow_pan
    accuracy: imprecise
    requires: nothing; not in descr_shortcuts.txt, so Rome handles it natively
    how: tap or hold the arrow keys
    note: Distance per press did not scale with the number of presses, so this is for nudging a target
      into frame, never for crossing the map. Reach for Home or locate_via_lists instead and pan only
      to fine-tune.
  zoom:
    zoom_in: z
    zoom_out: x
  zoom_presses_to_clamp: 8
  radar_hover_names_region_and_owner: true
  overlay_is_clickable: false
  finding_our_own_territory: 'The radar already draws explored territory in each faction''s colour, so
    our land can be found without opening anything: mask the radar for our faction''s colour and take
    the centroid. That gets the camera to the right region only — a province centroid is not a settlement,
    and the radar is about 228 px wide for the whole Mediterranean. For an exact landing use Home, or
    the Lists panel''s locate button for a settlement that is not the capital.'
