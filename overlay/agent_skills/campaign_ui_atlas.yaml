settlements:
  how_to_identify: 'Hover the settlement and read its tooltip. That is the only authoritative source:
    it names the owning faction in full and appends the standing in brackets after the tier. Our own settlements
    append nothing, and the absence is the signal.'
  tooltip_anatomy:
    line_1: settlement name, plus ' (Capital)' when it is a faction capital
    line_2: owning faction, spelled out — e.g. 'The House of Julii', 'Gaul'
    line_3: tier, plus ' (<standing>)' unless the settlement is ours
    line_4: 'three unlabelled figures against a coin, a crenellation and a growth glyph. Do NOT read these
      as population or income: the coin figure was 184 for a settlement whose population is 3500 and turn
      income 1710. Read labelled numbers from the Lists panel instead.'
    owned_only_line: '''x2 to get further information'' appears only on settlements we own, because only
      ours have a details panel — an independent read of ownership'
    warning: '''Hold Alt to expand tooltip'' does not add stats. Alt reveals an ''open Wiki'' affordance,
      and Alt+click hands off to the Steam overlay, which is the same hazard as F1. Do not press it.'
