controls:
  available: true
  source: data/text/descr_shortcuts.txt
  active_keyset:
    preference: KEYSET:0 in preferences.txt
    assumed: moderntw
    confirmed: false
    why_it_matters: 'The two keysets agree on end_turn (shift+enter) but disagree on the camera: moderntw
      zooms with Z/X, default zooms with Alt+Down/Alt+Up. Confirm by pressing Z on the campaign map and
      checking the zoom level before relying on any camera chord.'
  camera:
