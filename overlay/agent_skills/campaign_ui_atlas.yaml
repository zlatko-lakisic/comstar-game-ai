  note: The unlock line. Columns are settlement tiers with population thresholds; colour is built, grey
    is not. Green connectors are open paths. A red chain is a missing gate, not accept/reject — decision
    detection must not run inside it. Hover an icon for cost, time, and who it trains. Right-click opens
    the Building Information Scroll. Close with this parchment's X, not Escape.
