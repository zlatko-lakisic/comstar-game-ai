id: campaign_ui_facts
description: Verified Rome Remastered campaign UI facts for vision and reasoning agents
game: "Total War: ROME REMASTERED"
schema_version: 1

# Keep every value JSON-serialisable: the overlay is packed and sent over the Reach
# websocket as JSON. Unquoted ISO dates become datetime.date and break the whole
# session registration, so dates are quoted strings.

# Every coordinate below is normalised against the CLIENT rect (not the window rect)
# and was measured on a 16:9 client area. Treat them as anchors to look near, not as
# constants to click blindly — re-measure per frame where a detector exists.
frame:
  coordinate_space: client_rect_normalised
  measured_client_size: [1920, 1080]
  aspect: "16:9"

inject:
  heading: "## Campaign UI facts"
  max_chars: 2000

facts:
  - id: end_turn_control
    kind: control
    durable: true
    verified: "2026-09-04"
    statement: >
      The End Turn control is the round button at the far bottom-right of the client
      area, centred at (0.980, 0.971). Its icon is state dependent: a cream hourglass
      and a red horn have both been observed at the same centre in different
      campaigns. Identify it by position and round shape, never by colour.
    evidence:
      - "red horn disc bbox x1855-1909 y1024-1077, centre (1882, 1050)"
      - "cream hourglass disc at the same centre, new campaign 2026-09-04"
      - "frames: modal-unresolved-modal-f3cf556c0e-raw.png (horn), modal-unresolved-modal-b272df7824-raw.png (hourglass)"

  - id: panel_close_button
    kind: control
    durable: true
    verified: "2026-09-04"
    statement: >
      Parchment panels are closed by a round button bearing a gold crossed-swords X,
      centred ON the panel's top-right corner (straddling the panel edge, not inside
      it). This is the reliable way to dismiss a panel.
    evidence:
      - "left alerts dock: close X at (0.327, 0.077), panel x 0.03-0.33"
      - "senate mission card: close X at (0.160, 0.077), panel x 0.00-0.16"
      - "building browser: close X at (0.752, 0.196), panel x 0.26-0.74"
      - "found on 210/210 panel frames after generalising the search to any panel"

  - id: escape_key_is_unreliable
    kind: input
    durable: true
    verified: "2026-09-05"
    statement: >
      Escape closes some panels and is ignored by others — the settlement/building
      browser stayed open through 40+ Escape presses. Always prefer the panel's close
      X; use Escape only as a last resort for a blocking panel with no visible X.
      The documented exception is the advisor, whose own dismiss button reads
      "Dismiss advice [ESC]" (ST_ADVISOR_BUTTON_DISMISS). So Escape being unreliable
      is not a fact about Escape, it is a fact about the other panels: prefer a
      per-panel dismissal strategy over one global rule.
    evidence:
      - "ST_ADVISOR_BUTTON_DISMISS in shared.txt = 'Dismiss advice [ESC]'"

  - id: decision_panels_have_no_close_x
    kind: semantics
    durable: true
    verified: "2026-09-05"
    statement: >
      A blocking panel with no close X is not a detector failure — it is how the game
      says "you must answer this". DECISION panels replace the corner dismiss button
      with a footer trio at bottom centre (green check accept, red X reject, and a
      third counter-offer/auto-resolve button). Searching them for a close X finds
      nothing, correctly, because the button does not exist. Treat "blocking and no
      close X" as the signature of a decision panel and switch to reading the footer.
    evidence:
      - "9 diplomacy frames and 1 battle-deployment frame sat unidentified in the corpus purely because a close-X search returned nothing"
      - "both panels show the footer trio; neither has a corner X"

  - id: the_game_names_its_own_ui
    kind: ground_truth
    durable: true
    verified: "2026-09-05"
    statement: >
      Do not invent names for panels. Rome ships its own UI vocabulary in
      data/text/*.txt: strat.txt carries the strat-map tooltips (SMT_BUILDING_BROWSER
      = "Building Browser", SMT_OPEN_FINANCE_WINDOW = "Open finances window",
      SMT_BATTLE_DEPLOYMENT = "Battle Deployment"), cursor_action_tooltips.txt the
      action vocabulary, shortcut.txt every key binding. Store the string KEY rather
      than the English text: the name then resolves from the install, stays correct on
      a localised copy, and cannot drift from the game.
    evidence:
      - "14 of 14 atlas entries resolve against a stock install"
      - "path: <install>/Contents/Resources/Data/data/text"
      - "files are UTF-16 LE; comments (U+00AC) are only active when line 1 declares one"

  - id: diplomatic_negotiations_geometry
    kind: layout
    durable: true
    verified: "2026-09-05"
    statement: >
      The Diplomatic Negotiations panel is three scrolls in one — faction heir left,
      the negotiation centre, the diplomat right — so its measured span (x 0.20-0.76,
      top y 0.13) is wider than the centre scroll alone. It is a DECISION panel: the
      footer trio sits at bottom centre and there is no close X. Offers are labelled
      by SMT_THEIR_OFFERS and SMT_YOUR_OFFERS. Its top edge (0.13) is what separates
      it from the building browser (0.21), which it otherwise heavily overlaps.
    evidence:
      - "9 frames; right edge measured 0.75-0.79 across them"
      - "opened by right-clicking a diplomat onto a target (cursor tooltip diplomacy_mission)"

  - id: battle_deployment_is_the_campaign_boundary
    kind: hazard
    durable: true
    verified: "2026-09-05"
    statement: >
      The Battle Deployment panel (SMT_BATTLE_DEPLOYMENT, x 0.16-0.83, top y 0.35) is
      where the campaign hands over to the battle map. A DECISION panel with no close
      X; its footer offers auto-resolve, withdraw and fight, with a "Fight night
      battle" checkbox below. Choosing "fight" is irreversible and hands control to a
      battle map that no loop can yet drive, so until the battle phase exists the only
      safe answers are auto-resolve or withdraw.
    evidence:
      - "1 frame, from the battle entered at the end of the 25-turn run"
      - "Julii 200 soldiers vs Gaul 1148 — auto-resolving that is a loss, which is a decision the agent is not yet equipped to weigh"

  - id: panel_taxonomy
    kind: semantics
    durable: true
    verified: "2026-09-04"
    statement: >
      A panel being open does not mean the game is blocked. Three distinct classes:
      (1) DECISION panels show a green check and a red X glyph pair and must be
      answered; (2) NOTICE panels (senate mission assigned, alert/event cards in the
      left dock) ask nothing, leave the map playable and End Turn working, and can be
      left on screen; (3) OBSTRUCTING panels straddle the screen centre (settlement,
      building browser), ask nothing, but swallow input and must be closed. Treating
      every panel as a modal strands the turn on a panel with nothing to dismiss.
    evidence:
      - "senate mission card: no glyph pair, map playable, turn proceeds"
      - "building browser spans x 0.26-0.74 across the centre and blocks input"

  - id: turn_truth_lives_in_the_log
    kind: ground_truth
    durable: true
    verified: "2026-09-04"
    statement: >
      Screen state never proves a turn ended. In message_log.txt the autosave line
      'Turn <N> End.sav' carries the turn number and is written the instant the player
      ends the turn, before any AI faction moves, so it is both proof and a counter:
      compare N against the highest N seen before acting. The
      '****new round start turn(<faction>)****' line is written only once the AI round
      finishes, seconds to a minute later, so it must never be read as proof that an
      End Turn just worked — by the time it lands, the next attempt is usually already
      waiting, and it scores the previous turn a second time. A turn with a round-start
      line but no matching End.sav line was never ended.
    evidence:
      - "turns 3-7 each have a 'Turn N End.sav' line; turn 8 has none and never ended"
      - "order in the log: 'between turns' -> 'Turn 18 End.sav' -> 'start of timer time taken for AI turns' -> faction moves -> 'new round start turn(romans_julii)'"
      - "counting round-start lines scored 20 End Turn attempts as 19 successes while the campaign advanced 10 turns"
      - "path: %LOCALAPPDATA%/Feral Interactive/Total War ROME REMASTERED/VFS/Local/Rome/logs/message_log.txt"

  - id: message_log_can_be_silent_all_session
    kind: ground_truth
    durable: true
    verified: "2026-09-04"
    statement: >
      message_log.txt is not a dependable channel. Rome recreates it on every launch, so
      a campaign played in an earlier session leaves no trace, and a session has been
      observed writing nothing at all beyond its startup lines: the file stayed frozen
      at 77 lines and 3610 bytes while the agent drove the campaign from turn 1 to turn
      19, with no stratmap, round-start or autosave entries. Never treat the absence of
      a log line as evidence about the game; confirm against the saves folder.
    evidence:
      - "the whole run reported turns_ok=0 turns_failed=20 while Turn 19 End.sav was written on disk"
      - "the same path carried 142691 lines earlier the same day, so the path was right"
      - "a readiness gate keyed on the log refused to start on a live, playable campaign"

  - id: autosaves_are_the_turn_clock
    kind: ground_truth
    durable: true
    verified: "2026-09-04"
    statement: >
      The saves folder is the reliable turn clock, and it distinguishes two events that
      must not be confused. 'Turn N End.sav' appears the moment the player hands the
      turn over, before the AI factions move, and proves the End Turn registered.
      'Turn N+1 Start.sav' appears when the AI round hands control back, and is the only
      proof the player can act again. Rome keeps just the latest of each and rewrites
      them per turn. Read the most recently written file rather than the highest number,
      because abandoned campaigns leave old autosaves behind that would otherwise mask a
      fresh campaign forever.
    evidence:
      - "Turn 21 End.sav at 20:22:52 followed by Turn 22 Start.sav at 20:23:12, a 20s AI round"
      - "a 2024 campaign left Turn 69 End.sav, so a highest-number read returned 69 against a live turn 11"
      - "path: <rome_logs>/../saves, sibling of the logs folder"

  - id: never_blind_click_the_hud
    kind: hazard
    durable: true
    verified: "2026-09-04"
    statement: >
      Clicking unverified positions in the lower-right lands on the map or HUD and
      mutates game state. A fallback cascade of five guessed End Turn positions
      opened the building browser and wedged the run. Locate a control before
      clicking it; never sweep candidate coordinates.
    evidence:
      - "log line: 'Uknown settlement levelbuilding_browser_scroll scroll opened'"
      - "all five legacy candidates missed the button: 0.94/0.97 hit the HUD bar, the rest open map"

  - id: left_dock_geometry
    kind: layout
    durable: true
    verified: "2026-09-04"
    statement: >
      Alert, event and senate mission cards dock against the left edge, spanning
      x 0.00 to roughly 0.16-0.33 with their top edge near y 0.07. A vertical strip
      of round category icons (horn, scroll, coins, eagle) sits immediately to their
      right, and those icons are gold — do not mistake them for the close X.

  - id: building_browser_geometry
    kind: layout
    durable: true
    verified: "2026-09-04"
    statement: >
      The settlement building browser spans x 0.26-0.74 with its top edge near
      y 0.21, and covers the bottom-right HUD including the End Turn control. Its
      construction tree is full of green and red connector lines that mimic
      accept/reject glyphs, so decision detection must not run inside it.

  - id: camera_lighting_varies
    kind: perception
    durable: true
    verified: "2026-09-04"
    statement: >
      Winter and night cameras render the map dim and nearly flat: centre luminance
      around 0.15 with low variance, while the HUD edges stay near 0.30. A dark map
      centre alone does not mean a pause menu or a failed capture — the pause menu
      and a dead capture darken the edges too.

  - id: capture_the_client_rect
    kind: perception
    durable: true
    verified: "2026-09-03"
    statement: >
      Screenshots must cover the client rect. Capturing the window rect includes the
      title bar and borders, which offsets every derived coordinate against clicks
      that are computed from the client rect, so vision-derived clicks miss.
    evidence:
      - "window 1936x1119 vs client 1920x1080 on the reference machine"

# Deliberately NOT knowledge for a reasoning model. These are properties of the
# current pixel heuristics, not of the game, and would mislead a stronger model.
detector_artifacts:
  - "cream mask RGB bounds used by _cream_mask"
  - "0.32 column-density threshold in panel_bounds (0.45 missed cards with artwork and text)"
  - "topmost-blob window sizes and centroid refinement radii in localize_panel_close_x"
  - "left_overlay_parchment_ratio >= 0.10 as a panel trigger (the left HUD strip alone reaches it)"

# Frames with hand-verified answers, usable as a scored regression set for any
# replacement perception model. Regenerate the signatures with
# `python scripts/cluster_ui_corpus.py --refresh`.
#
# 180 of the 454 frames are NOT scorable and must be excluded rather than explained:
# 142 are 1936x1119, the window rect captured before the client-rect fix, so every
# coordinate derived from them is offset; 38 are 100x60 stubs. Nearly 40% of what
# looked like an unsolved perception corpus was stale evidence of an already-fixed
# bug — check frame size before attributing a frame to the UI.
eval_set:
  location: data/runtime/modal-unresolved-*-raw.png
  frame_size: [1920, 1080]
  total_frames: 454
  scorable_frames: 274
  excluded:
    - count: 142
      reason: window-rect capture (1936x1119), predates the client-rect fix
    - count: 38
      reason: 100x60 stub, failed capture
  expectations:
    - count: 125
      contents: building browser over the centre
      panel: [0.26, 0.74, 0.21]
      expect: {blocking: true, close_x: true, mode: modal, atlas_id: building_browser}
    - count: 96
      contents: senate mission card in the left dock, mostly over a dim night map
      panel: [0.0, 0.16, 0.07]
      expect: {blocking: false, close_x: true, atlas_id: senate_mission_card}
    - count: 9
      contents: Diplomatic Negotiations, a decision panel with no close X
      panel: [0.2, 0.76, 0.13]
      expect: {blocking: true, close_x: false, mode: modal, atlas_id: diplomatic_negotiations}
    - count: 6
      contents: left dock notice card
      panel: [0.0, 0.33, 0.07]
      expect: {blocking: false, close_x: true, atlas_id: left_dock_notice}
    - count: 1
      contents: Battle Deployment, the campaign/battle boundary
      panel: [0.16, 0.83, 0.35]
      expect: {blocking: true, close_x: false, mode: modal, atlas_id: battle_deployment}
    - count: 26
      contents: clear campaign map, no panel
      expect: {blocking: false, close_x: false, mode: campaign_map}
    - count: 10
      contents: pause screen
      expect: {blocking: false, close_x: false, mode: pause}
    - count: 1
      contents: classified modal but carries no panel — a genuine misclassification
      expect: {blocking: false, close_x: false}
  scored: "237/274 scorable frames identified (86%); 0 unmatched panels; the rest carry no panel"
