[project]
name = "comstar-game-ai"
version = "0.1.0"
description = "Autonomous Rome Remastered opponent via AO Reach"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "ao-reach>=0.13.0",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pywin32>=306; sys_platform == 'win32'",
    "PySide6>=6.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
comstar-game-io = "comstar_game_ai.game_io.main:main"
comstar-agent = "comstar_game_ai.agent.main:main"
comstar-overlay = "comstar_game_ai.overlay_ui.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration_ada: live tests against ada AO engine (requires mTLS material)",
    "requires_game: tests that need Rome Remastered running",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["comstar_game_ai"]
omit = ["tests/*"]
